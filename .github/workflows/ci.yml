name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust (test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (native)
        run: cargo test --workspace --exclude geo-wasm
      - name: Test (geo-wasm)
        run: cargo test -p geo-wasm
      - name: Build docs
        run: cargo doc --workspace --no-deps --document-private-items

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check wasm target
        run: cargo check --workspace --target wasm32-unknown-unknown

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build WASM package
        run: wasm-pack build --dev --target web crates/geo-wasm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: pnpm typecheck
      - name: Test SDK and tooling
        run: pnpm test
      - name: Lint TypeScript and Vue
        run: pnpm lint
      - name: Build SDK, Vue and site
        run: pnpm build
      - name: Build packaged browser regression pages
        run: pnpm --filter @geo-rs/site build:browser

  bench:
    name: Benchmarks (regression check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/bench-baseline
            . -> target/bench-current
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test performance gate
        run: node --test .github/scripts/bench-compare.test.mjs
      - name: Compare native benchmarks on the same runner
        env:
          BENCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node .github/scripts/bench-run.mjs
      - name: Upload benchmark measurements and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-benchmarks-${{ github.sha }}
          path: target/performance/
          if-no-files-found: error
          retention-days: 30
